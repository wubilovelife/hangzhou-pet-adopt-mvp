<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>杭州宠伴 · 管理后台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#22362e;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#238367;color:white}button.secondary{background:#e3f0e9;color:#226c56}button.danger{background:#b9554a}button:disabled{opacity:.55}input,select,textarea{padding:10px;border:1px solid #d7e4dc;border-radius:8px;max-width:100%}input[type=text],input[type=email],input[type=password],textarea{width:100%}textarea{min-height:75px}.login{max-width:400px;margin:12vh auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 35px #123a2410}.login h1{font-size:25px}label{display:block;font-size:13px;margin:16px 0 6px}.hint{font-size:12px;color:#778b80;line-height:1.7}.error{color:#aa4037;font-size:13px}.head{background:white;padding:19px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2eae5}.layout{display:flex;min-height:calc(100vh - 75px)}nav{width:205px;background:#fff;padding:20px 12px;border-right:1px solid #e2eae5}nav button{display:block;background:transparent;color:#4d6257;width:100%;text-align:left;margin-bottom:5px}nav button.active{background:#e6f3ec;color:#167551;font-weight:700}main{padding:25px;flex:1;overflow:auto}h1,h2{margin-top:0}h2{font-size:22px}.cards{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4ebe6;border-radius:14px;padding:17px;margin-bottom:15px;overflow:auto}.metric b{font-size:30px;display:block;margin-top:10px}.metric small{color:#748a7e}table{border-collapse:collapse;width:100%;background:white;min-width:850px}td,th{border-bottom:1px solid #e4eae5;padding:13px;text-align:left;font-size:13px;vertical-align:top}th{color:#728579;background:#f9fbf9}td button{margin:2px;padding:7px 10px;font-size:12px}pre{white-space:pre-wrap;word-break:break-word;max-width:520px;font-size:12px}.toolbar{display:flex;gap:10px;margin:12px 0;align-items:center;flex-wrap:wrap}.status{font-size:12px;background:#e8f3ec;padding:5px 9px;border-radius:7px;white-space:nowrap}.empty{padding:50px;text-align:center;color:#849389}.notice{padding:13px;background:#fff4e7;border-radius:9px;color:#876638;font-size:13px;margin-bottom:16px}@media(max-width:800px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;padding:7px}nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}main{padding:12px}.head{padding:15px}}
</style></head><body><div id="app"><div class="login">正在连接身份认证服务…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const URL='https://cqsdplpaniumjqpkgqgt.supabase.co';
const KEY='sb_publishable_dGgKw7TNY8Cufp8n9Db3Mw_7U9X942W';
const db=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const app=document.querySelector('#app');let session=null,section='dashboard',records={},lastError='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={pending:'待审核',approved:'已上架',rejected:'已驳回',withdrawn:'已下架',adopted:'领养成功',pending_platform:'待平台初审',pending_owner:'待送养人审核',pending_visit:'待预约家访',visiting:'家访进行中',pending_agreement:'待签署协议',trial:'试养中',returned:'试养退回',open:'待处理',processing:'处理中',closed:'已关闭'};
const status=v=>'<span class="status">'+esc(st[v]||v)+'</span>';
function login(error=''){app.innerHTML='<div class="login"><h1>杭州宠伴 · 管理员登录</h1><p class="hint">仅授权管理员可访问业务资料。采用 Supabase Auth，管理员身份由数据库权限控制。</p><form id="loginForm"><label>管理员邮箱</label><input type="email" name="email" autocomplete="username" required><label>密码</label><input type="password" name="password" autocomplete="current-password" required><p class="error">'+esc(error)+'</p><button type="submit" style="width:100%">登录</button></form><p class="hint">首次使用须在 Supabase 创建 Auth 用户，并由项目所有者将用户 ID 加入 admin_members。此页面不提供公开注册。</p></div>';document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=e.target.querySelector('button');b.disabled=true;b.textContent='校验中…';let {error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error)login('登录失败：'+error.message);else await gate()}}
async function gate(){if(!db)return login('身份认证 SDK 加载失败，请检查网络。');let {data:{session:s},error}=await db.auth.getSession();if(error||!s){session=null;login();return}let {data:member,error:roleError}=await db.from('admin_members').select('role').eq('user_id',s.user.id).maybeSingle();if(roleError||member?.role!=='admin'){session=null;await db.auth.signOut();login('此账号没有管理员权限，请先完成账号授权。');return}session=s;await load();}
async function logout(){session=null;await db.auth.signOut();login()}
function notify(message){alert(message)}
const tables=['pets','adoption_applications','home_visits','blacklist','profiles','course_results','adoption_agreements','handoffs','followups','reports','audit_logs'];
async function load(){lastError='';const results=await Promise.all(tables.map(t=>db.from(t).select('*').limit(1000)));records={};results.forEach((r,i)=>{records[tables[i]]=r.data||[];if(r.error)lastError+=tables[i]+': '+r.error.message+'; '});draw()}
function userName(id){return records.profiles.find(x=>x.id===id)?.display_name||id||'—'}
function petName(id){return records.pets.find(x=>x.id===id)?.name||id||'—'}
function dt(x){return x?new Date(x).toLocaleString('zh-CN'):'—'}
function table(headers,rows){return rows.length?'<div class="card"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="card empty">暂无相关记录</div>'}
function button(label,func,arg,color=''){return '<button class="'+color+'" onclick="'+func+'(\''+esc(arg)+'\')">'+label+'</button>'}
const raw=x=>'<details><summary>查看完整表单 / 档案</summary><pre>'+esc(JSON.stringify(x,null,2))+'</pre></details>';
const menus=[['dashboard','数据看板'],['pets','送养帖子审核'],['applications','领养申请初审'],['visits','家访任务'],['records','全链路档案'],['blacklist','黑名单管理'],['reports','投诉工单']];
function draw(){if(!session)return login();app.innerHTML='<header class="head"><div><strong>杭州宠伴 · PC管理后台</strong><div class="hint">仅授权管理员 · 实时读取 Supabase</div></div><div><button class="secondary" onclick="load()">刷新</button> <button class="secondary" onclick="logout()">退出登录</button></div></header><div class="layout"><nav>'+menus.map(([key,label])=>'<button class="'+(section===key?'active':'')+'" onclick="section=\''+key+'\';draw()">'+label+'</button>').join('')+'</nav><main><div class="toolbar"><h2 style="margin:0">'+menus.find(m=>m[0]===section)[1]+'</h2><button class="secondary" onclick="exportCSV()">导出当前数据 CSV（Excel 可打开）</button></div>'+(lastError?'<div class="notice">部分数据读取失败：'+esc(lastError)+'</div>':'')+content()+'</main></div>'}
function content(){let p=records.pets||[],a=records.adoption_applications||[],v=records.home_visits||[],r=records.reports||[];
if(section==='dashboard'){let vals=[['送养发布量',p.length],['帖子通过率',p.length?(p.filter(x=>x.status==='approved').length/p.length*100).toFixed(1)+'%':'—'],['领养申请量',a.length],['家访通过率',v.filter(x=>x.decision&&x.decision!=='pending').length?(v.filter(x=>x.decision==='passed').length/v.filter(x=>x.decision&&x.decision!=='pending').length*100).toFixed(1)+'%':'—'],['试养退回量',a.filter(x=>x.status==='returned').length],['待回访数',(records.followups||[]).filter(x=>!x.outcome||x.outcome==='pending').length],['投诉工单',r.length],['黑名单人数',(records.blacklist||[]).length]];return '<div class="cards">'+vals.map(x=>'<div class="card metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div>'}
if(section==='pets')return table(['昵称 / 类型','区域','发布人','费用及资料','审核状态','操作'],p.map(x=>[esc(x.name)+'<br>'+esc(x.species),esc(x.district),esc(userName(x.owner_id)),raw(x.profile)+'<div class="hint">照片：'+esc((x.photo_urls||[]).join('; '))+'</div>',status(x.status),x.status==='pending'?button('通过上架','reviewPet',x.id)+button('驳回','rejectPet',x.id,'danger'):'—']));
if(section==='applications')return table(['宠物','申请人','完整申请问卷','状态','操作'],a.map(x=>[esc(petName(x.pet_id)),esc(userName(x.applicant_id)),raw(x.form_data),status(x.status),x.status==='pending_platform'?button('初审通过','approveApplication',x.id)+button('驳回','rejectApplication',x.id,'danger'):'—']));
if(section==='visits')return table(['领养申请','预约时间','志愿者','家访截图/评估','结论','操作'],v.map(x=>[esc(x.application_id),dt(x.scheduled_at),esc(userName(x.volunteer_id)),raw({evidence_urls:x.evidence_urls,assessment:x.assessment}),status(x.decision||'pending'),button('记录结论','decideVisit',x.id)]));
if(section==='records')return '<div class="notice">本模块显示全部申请及关联档案（默认每表最多读取 1000 条）。请勿把个人资料导出后公开传播。</div>'+table(['申请','宠物','状态','资料及相关记录'],a.map(x=>[esc(x.id),esc(petName(x.pet_id)),status(x.status),raw({application:x,visits:v.filter(y=>y.application_id===x.id),agreements:(records.adoption_agreements||[]).filter(y=>y.application_id===x.id),handoffs:(records.handoffs||[]).filter(y=>y.application_id===x.id),followups:(records.followups||[]).filter(y=>y.application_id===x.id)})]));
if(section==='blacklist')return '<div class="card"><label>已注册用户 UUID</label><input id="blockUser" type="text" placeholder="Supabase Auth 用户 ID"><label>拉黑原因</label><textarea id="blockReason" placeholder="必须填写原因"></textarea><p><button onclick="addBlacklist()">新增黑名单</button></p></div>'+table(['用户 UUID','拉黑原因','时间','操作'],(records.blacklist||[]).map(x=>[esc(x.user_id),esc(x.reason),dt(x.created_at),button('移除','removeBlacklist',x.user_id,'danger')]));
if(section==='reports')return table(['类型','举报人','详细内容 / 证据','状态','处理'],r.map(x=>[esc(x.category),esc(userName(x.reporter_id)),raw(x),status(x.status),x.status!=='closed'?button('处理并关闭','closeReport',x.id):'—']));
return ''}
async function change(tableName,id,patch){const {data,error}=await db.from(tableName).update(patch).eq('id',id).select('id');if(error)return notify('操作失败：'+error.message);if(!data?.length)return notify('未修改任何记录，请核查管理员权限');await logAction('update_'+tableName,tableName,id,patch);await load()}
async function logAction(action,entity_type,entity_id,details){let r=await db.from('audit_logs').insert({actor_id:session.user.id,action,entity_type,entity_id:String(entity_id),details});if(r.error)console.warn('审计日志写入失败',r.error.message)}
async function reviewPet(id){if(confirm('确认资料合规并审核上架？'))await change('pets',id,{status:'approved',review_reason:null})}
async function rejectPet(id){let reason=prompt('请填写帖子驳回理由');if(reason?.trim())await change('pets',id,{status:'rejected',review_reason:reason.trim()})}
async function approveApplication(id){if(confirm('确认平台初审通过并转交送养人？'))await change('adoption_applications',id,{status:'pending_owner',rejection_reason:null})}
async function rejectApplication(id){let reason=prompt('请填写领养申请驳回理由');if(reason?.trim())await change('adoption_applications',id,{status:'rejected',rejection_reason:reason.trim()})}
async function decideVisit(id){let reason=prompt('请填写完整家访评估及结论理由');if(!reason?.trim())return;let passed=confirm('家访结论：确定为“通过”吗？取消则记录为“不通过”。');let x=records.home_visits.find(y=>y.id===id);let {error}=await db.from('home_visits').update({assessment:reason,decision:passed?'passed':'failed'}).eq('id',id);if(error)return notify(error.message);const next=passed?'pending_agreement':'rejected';let a=await db.from('adoption_applications').update({status:next,...(!passed?{rejection_reason:reason}:{})}).eq('id',x.application_id);if(a.error)return notify('家访记录已写入，但申请状态修改失败：'+a.error.message);await logAction('visit_review','home_visits',id,{passed,reason});await load()}
async function addBlacklist(){let id=document.querySelector('#blockUser').value.trim(),reason=document.querySelector('#blockReason').value.trim();if(!/^[a-f\d-]{36}$/i.test(id)||!reason)return notify('请填写有效的用户 UUID 和原因');const {error}=await db.from('blacklist').insert({user_id:id,reason});if(error)return notify(error.message);await logAction('blacklist_add','blacklist',id,{reason});await load()}
async function removeBlacklist(id){if(!confirm('确认从黑名单移除？'))return;const {error}=await db.from('blacklist').delete().eq('user_id',id);if(error)return notify(error.message);await logAction('blacklist_remove','blacklist',id,{});await load()}
async function closeReport(id){let resolution=prompt('请填写工单处理结果（必填）');if(resolution?.trim())await change('reports',id,{status:'closed',resolution:resolution.trim()})}
function csvValue(value){let v=typeof value==='object'?JSON.stringify(value):String(value??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCSV(){let names=section==='dashboard'?['pets','adoption_applications','home_visits','reports']:section==='applications'?['adoption_applications']:section==='visits'?['home_visits']:section==='records'?['adoption_applications','home_visits','adoption_agreements','handoffs','followups']:section==='blacklist'?['blacklist']:section==='reports'?['reports']:['pets'];for(let name of names){let rows=records[name]||[];if(!rows.length)continue;let cols=[...new Set(rows.flatMap(Object.keys))],csv='\uFEFF'+cols.map(csvValue).join(',')+'\r\n'+rows.map(row=>cols.map(c=>csvValue(row[c])).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='hangzhou-pet-'+name+'.csv';link.click();URL.revokeObjectURL(url)}}
gate().catch(e=>login('认证初始化失败：'+e.message));
</script></body></html>
