function answer(i,j,multi){let a=String(data.answers[i]??'').split(',').filter(Boolean);if(multi){a=a.includes(String(j))?a.filter(x=>x!==String(j)):[...a,String(j)];data.answers[i]=a.join(',')}else data.answers[i]=String(j);save()}
async function grade(){
if(![1,2,3].every(n=>data['video'+n]))return toast('请先完成3段课程');
let score=quiz.reduce((s,q,i)=>{let mine=String(data.answers[i]??'').split(',').filter(Boolean).sort().join(',');let right=(Array.isArray(q[2])?q[2]:[q[2]]).map(String).sort().join(',');return s+(mine===right?1:0)},0);
data.quizScore=score;data.passed=score>=8;save();
if(!await refreshAuth()){go('profile');toast('请先登录，再保存测评结果');return}
const {error}=await api.from('course_results').upsert({user_id:authUser.id,score:score},{onConflict:'user_id'});
if(error){toast('成绩未保存至平台：'+error.message);return}
toast('测评得分 '+score+'/10，'+(data.passed?'已通过':'未通过'));
if(data.passed){data.draft.petId=selectedPet;formStep=0;go('apply')}
}

async function nextPost(){
const p=data.postDraft;

if(postStep===1&&(!p.type||!p.name||!p.age||!p.district||!p.medical))return toast('请完善宠物信息');

if(!await refreshAuth()){toast('请先通过邮箱登录');go('profile');return}

function sign(id){if(!document.getElementById('sign1').checked||!document.getElementById('sign2').checked)return toast('双方均需确认协议');let a=data.applications.find(x=>x.id===id);a.deposit=Number(document.getElementById('deposit').value);a.depositStatus=a.deposit?'模拟托管中':'无押金';a.signedAt=new Date().toLocaleString('zh-CN');a.status='试养冷静期';a.handoffPending=true;log('模拟双方签署协议',id);go('trial',id)}
function trial(){let a=currentApp();if(!a)return go('myApps');const end=a.handoffAt?new Date(a.handoffAt).getTime()+7*864e5:0;const left=end?Math.max(0,Math.ceil((end-Date.now())/864e5)):7;mobile(`<div class="wrap"><h2>7天试养冷静期</h2><div class="hero"><span class="micro">线下当面交付后开始计时</span><h1>${a.handoffAt?`${left} 天`:'待上传交接凭证'}</h1><p>冷静期内及时沟通宠物适应情况。试养结束后可确认正式领养。</p></div><div class="card"><h3>交接记录</h3><p class="desc">需杭州线下当面交接，双方共同核对宠物情况。</p><input type="file" accept="image/*" onchange="aFile(${a.id},this.files[0]?.name)"><p class="small">${esc(a.handoffProof||'尚未上传凭证')}</p>${!a.handoffAt?btn('确认完成线下交付',`confirmHandoff(${a.id})`):''}</div><div class="card"><h3>押金状态</h3><p class="desc">${a.deposit?a.deposit+'元 · '+a.depositStatus:'未设置押金'}</p></div><div class="footeractions">${btn('申请退回宠物',`returnPet(${a.id})`,'button danger')}${btn('确认正式领养',`finishAdoption(${a.id})`)}</div></div>`,'试养冷静期')}
function aFile(id,name){let a=data.applications.find(x=>x.id===id);a.handoffProof=name;save();render()}function confirmHandoff(id){let a=data.applications.find(x=>x.id===id);if(!a.handoffProof)return toast('请先上传线下交接凭证');a.handoffAt=new Date().toISOString();a.handoffPending=false;log('线下交接完成',id);render()}function finishAdoption(id){let a=data.applications.find(x=>x.id===id);if(!a.handoffAt)return toast('请先完成线下交接');if(Date.now()-new Date(a.handoffAt).getTime()<7*864e5)return toast('7天冷静期未结束，暂不能确认');a.status='领养成功';a.adoptedAt=new Date().toISOString();a.followups=[7,30,90].map(n=>({day:n,status:'待回访'}));log('领养成功',id);go('followup',id)}function returnPet(id){let reason=prompt('请填写退回原因（必填）');if(!reason?.trim())return toast('须填写退回理由');let a=data.applications.find(x=>x.id===id);a.status='试养退回';a.reason=reason;a.depositStatus=a.deposit?'模拟退款待平台核验':'无押金';log('申请试养退回',id);go('appDetail',id)}
function followup(){let a=currentApp();if(!a)return go('myApps');let f=a.followups||[];mobile(`<div class="wrap"><h2>领养回访</h2><p class="desc">正式领养后第7、30、90天触发回访。上传打卡照片并等待志愿者标记结论。</p>${f.map((x,i)=>`<div class="card"><div class="row"><h3>第${x.day}天回访</h3><span class="pill">${x.status}</span></div><p class="small">预定日期：${new Date(new Date(a.adoptedAt).getTime()+x.day*864e5).toLocaleDateString('zh-CN')}</p><input type="file" accept="image/*,video/*" onchange="followFile(${a.id},${i},this.files[0]?.name)"><p class="small">${esc(x.file||'未提交素材')}</p></div>`).join('')}</div>`,'回访管理')}
function followFile(id,i,file){let a=data.applications.find(x=>x.id===id);a.followups[i].file=file;a.followups[i].status='待志愿者核验';log('提交回访素材',id);render()}
function profile(){mobile(`<div class="wrap">${authUser?'<div class="card"><p class="desc">已登录：'+esc(authUser.email||'用户')+'</p>'+btn('退出登录','logoutOnline()','button outline')+'</div>':authPanel()}<div class="hero"><h2>◉ ${esc(data.user)}</h2><p>实名及人脸核验：${data.verified?'已登记（待正式核验）':'未核验'}<br>账户状态：${blocked()?'黑名单 · 禁止发布和申请':'正常'}</p></div><div class="card">${[['养宠测评档案','course'],['消息通知','messages'],['帮助中心与平台规则','rules'],['投诉举报','report']].map(([x,p])=>`<div class="line row" onclick="go('${p}')"><strong>${x}</strong><span>›</span></div>`).join('')}</div><div class="card"><p class="desc">测评成绩：${data.quizScore}/10 · ${data.passed?'已通过':'未通过'}</p><p class="desc">身份核验功能尚未开放</p></div>${btn('清除本机保存的数据',"if(confirm('清除本机保存的数据并恢复初始状态？')){localStorage.removeItem('hangzhou-pet-demo');location.reload()}",'button danger')}</div>`,'个人中心',false,true)}
function report(){mobile(`<div class="wrap"><h2>投诉与举报</h2><div class="card"><div class="field"><label>举报类型</label><select id="reportType"><option>违规收费 / 宠物买卖</option><option>虚假送养信息</option><option>疑似虐待 / 恶意弃养</option><option>隐私和骚扰</option><option>其他</option></select></div><div class="field"><label>情况说明</label><textarea id="reportText" placeholder="请提供时间、人员、事实及线索"></textarea></div><div class="field"><label>证据图片</label><input id="reportEvidence" type="file" accept="image/*"></div>${btn('提交举报工单',"submitReport()")}</div></div>`,'投诉举报')}function submitReport(){let desc=document.getElementById('reportText').value;if(desc.trim().length<8)return toast('描述至少8个字');let id=Date.now();data.reports.unshift({id,type:document.getElementById('reportType').value,desc,file:document.getElementById('reportEvidence').files[0]?.name||'',status:'待处理'});log('提交举报工单',id);go('profile');toast('举报已受理，工单号 '+id)}
function messages(){mobile(`<div class="wrap"><h2>消息通知</h2>${data.audit.length?data.audit.slice(0,30).map(a=>`<div class="card"><strong>${esc(a.action)}</strong><p class="small">${esc(a.at)} · ${esc(a.subject)}</p></div>`).join(''):'<div class="empty">暂无消息</div>'}</div>`,'消息通知')}
function rules(){mobile(`<div class="wrap"><h2>平台规则与领养流程</h2><div class="card"><div class="timeline">${['杭州手机号注册及实名人脸核验','送养人发布，经人工审核后上架','领养人学完课程并测评合格','平台初审 → 送养人审核','三方预约视频家访并完成评估','双方签署领养协议（押金可选）','杭州线下当面交付并留存凭证','7天试养冷静期 → 正式领养','第7、30、90天回访'].map(s=>`<div>${s}</div>`).join('')}</div></div><div class="card"><h3>禁止事项</h3><p class="desc">异地领养、买卖交易、虚高收费、捆绑消费、虐待、恶意弃养、虚假资料。仅允许经票据核验的实际疫苗、绝育、驱虫成本；黑名单禁止发布或申请。</p></div><div class="muted-box">实名认证、电子签署、押金支付与通知功能正在建设中，请勿在当前版本提交敏感个人信息。</div></div>`,'帮助中心与规则')}
function ownerDecision(id,ok){let a=data.applications.find(x=>x.id===id);if(a.status!=='待送养人审核')return;let reason=ok?'':prompt('送养人拒绝理由（必填）');if(!ok&&!reason?.trim())return toast('必须填写拒绝理由');a.status=ok?'待预约家访':'申请驳回';a.reason=reason;log('送养人'+(ok?'同意':'拒绝')+'申请',id);render()}
function render(){switch(page){case 'home':return home();case 'pet':return pet();case 'course':return course();case 'apply':return apply();case 'myApps':return myApps();case 'appDetail':return appDetail();case 'myPosts':return myPosts();case 'publish':return publish();case 'profile':return profile();case 'rules':return rules();case 'messages':return messages();case 'report':return report();case 'visit':return visit();case 'agreement':return agreement();case 'trial':return trial();case 'followup':return followup();}}render();refreshAuth().then(async()=>{await loadOnlinePets();if(authUser)await loadOnlineMine();});api.auth.onAuthStateChange((event,session)=>{authUser=session?.user||null;if(event==='SIGNED_IN')setTimeout(()=>{loadOnlineMine();render()},0)});
</script></body></html>
